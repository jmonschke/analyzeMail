[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analyzemail"
version = "0.1.0"
description = "Analyze Gmail Takeout mbox files for conservative cleanup candidates"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "analyzemail contributors"}]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
analyzemail = "analyzemail.cli:main"

[tool.setuptools.packages.find]
include = ["analyzemail*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
